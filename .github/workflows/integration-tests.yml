name: Integration Tests

on:
  schedule:
    - cron: "37 14 * * *"
  pull_request:
    # Only the code the integration suite actually exercises: the graph and its
    # providers/prompts. Docs and Python-service changes cannot break it, so
    # they must not pay for a run.
    paths:
      - "apps/orchestrator/src/**"
      - "apps/orchestrator/tests/**"
      - "apps/orchestrator/prompts/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    name: Integration Tests
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build project
        run: pnpm --filter youtube-shorts-orchestrator build
      - name: Run integration tests
        run: pnpm --filter youtube-shorts-orchestrator test:int
